name: Deploy Web Rental to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🛠️ 3. Install & Build Frontend Assets (Vite)
        run: |
          npm install
          npm run build

      - name: 📂 4. Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            .env.example
            .htaccess
            tests/**
            phpunit.xml
            README.md
            design.md
            skills-lock.json
            storage/logs/*
            storage/framework/cache/data/*
            storage/framework/sessions/*
            storage/framework/views/*
            storage/app/public/**

      # LANGKAH OTOMATISASI:
      - name: ⚡ 5. Auto Migrate & Clear Cache on cPanel
        run: |
          echo "Menjalankan migrasi database otomatis..."
          curl -s -G --data-urlencode "key=${{ secrets.APP_KEY }}" --data-urlencode "action=migrate" https://rentgoindonesia.com/cpanel-artisan
          echo "Membersihkan & memperbarui cache Laravel..."
          curl -s -G --data-urlencode "key=${{ secrets.APP_KEY }}" --data-urlencode "action=optimize-clear" https://rentgoindonesia.com/cpanel-artisan